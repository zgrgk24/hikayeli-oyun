<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GÖLGE OPERASYONU: AKSİYON - Ghost Pulse Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100vw;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            background: #050b14;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0,229,255,0.3);
            display: flex;
            flex-direction: column;
        }

        /* CANLI ANİMASYON EKRANI */
        #gameCanvas {
            width: 100%;
            height: 65%;
            background: #02050a;
            display: block;
        }

        /* KONTROL VE ETKİLEŞİM ALANI */
        .ui-panel {
            height: 35%;
            background: rgba(10, 16, 30, 0.95);
            border-top: 2px solid #00e5ff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #00e5ff;
            text-shadow: 0 0 8px rgba(0,229,255,0.6);
        }

        .action-area {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* BTN STYLE */
        .main-btn {
            background: linear-gradient(135deg, #00e5ff, #0066ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px #00e5ff;
        }
        .main-btn:active { transform: scale(0.95); }

        /* MİNİ OYUN 1: ZAMANLAMA BARI */
        .timing-bar-bg {
            width: 80%; height: 30px; background: #1e293b;
            border: 2px solid #00e5ff; border-radius: 15px;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .timing-zone {
            position: absolute; top: 0; height: 100%; width: 20%;
            background: #22c55e; left: 40%; box-shadow: 0 0 15px #22c55e;
        }
        .timing-pointer {
            position: absolute; top: 0; width: 6px; height: 100%;
            background: #ef4444; box-shadow: 0 0 10px #ef4444;
        }

        /* MİNİ OYUN 2: HIZLI DOKUNMA TARGET */
        .qte-target {
            width: 70px; height: 70px;
            background: rgba(239, 68, 68, 0.8);
            border: 3px solid #fff; border-radius: 50%;
            position: absolute; cursor: pointer;
            box-shadow: 0 0 25px #ef4444;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif; font-weight: bold;
            animation: pulseTarget 0.4s infinite alternate;
        }

        /* MİNİ OYUN 3: HAFIZA BUTONLARI */
        .memory-grid { display: flex; gap: 15px; }
        .mem-btn {
            width: 60px; height: 60px; border-radius: 10px; border: 2px solid #fff;
            cursor: pointer; opacity: 0.5; transition: opacity 0.1s;
        }
        .mem-btn.active { opacity: 1; transform: scale(1.1); box-shadow: 0 0 20px #fff; }

        @keyframes pulseTarget { from { transform: scale(0.9); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-panel">
        <div class="status-text" id="statusText">GÖLGE OPERASYONU: BAŞLAMAK İÇİN BUTONA BAS</div>
        <div class="action-area" id="actionArea">
            <button class="main-btn" onclick="nextStage()">OPERASYONU BAŞLAT</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    /* OYUN DURUMU & KARAKTER ANİMASYONU */
    let stage = 0; // 0: Start, 1: Havalandırma, 2: Dövüş, 3: Hack, 4: Kaçış/Cam
    let player = { x: 50, y: 180, state: 'idle', frame: 0 };
    let enemy = { x: 280, y: 180, state: 'idle', alive: true };
    let vent = { x: 50, y: 80, open: false };
    let particles = [];

    /* CANVAS ÇİZİM MOTORU */
    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Arka Plan Dekorasyon (Siber Bina)
        ctx.fillStyle = "#0a1224";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Zemin
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 220, canvas.width, 40);
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(0, 220, canvas.width, 2);

        // Havalandırma Kapağı Çizimi
        ctx.fillStyle = vent.open ? "#050b14" : "#475569";
        ctx.fillRect(vent.x, vent.y, 40, 50);
        ctx.strokeStyle = "#00e5ff";
        ctx.strokeRect(vent.x, vent.y, 40, 50);

        // Karakter Çizimi (Aksiyon Durumlarına Göre)
        drawPlayer();

        // Düşman Çizimi
        if (enemy.alive && stage >= 2) {
            drawEnemy();
        }

        // Parçacık Efektleri (Vuruş/Kıvılcım)
        particles.forEach((p, index) => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.vx;
            p.y += p.vy;
            p.size *= 0.95;
            if (p.size < 0.5) particles.splice(index, 1);
        });

        requestAnimationFrame(drawGame);
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Gövde (Siyah Ajan Kostümü)
        ctx.fillStyle = "#00e5ff";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00e5ff";

        if (player.state === 'idle') {
            // Durma
            ctx.fillRect(-10, -40, 20, 35); // Beden
            ctx.beginPath(); ctx.arc(0, -48, 8, 0, Math.PI*2); ctx.fill(); // Kafası
        } 
        else if (player.state === 'climbing') {
            // Havalandırmaya Tırmanma
            ctx.fillRect(-10, -50, 20, 35);
            ctx.beginPath(); ctx.arc(0, -58, 8, 0, Math.PI*2); ctx.fill();
            // Kol uzatma
            ctx.fillRect(-15, -65, 8, 20);
        }
        else if (player.state === 'punching') {
            // Yumruk Atma
            ctx.fillRect(-10, -40, 20, 35);
            ctx.beginPath(); ctx.arc(0, -48, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(10, -35, 25, 8); // İleri Uzanan Yumruk
        }

        ctx.restore();
    }

    function drawEnemy() {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.fillStyle = enemy.state === 'hit' ? "#ef4444" : "#f59e0b";
        ctx.shadowBlur = 10;
        ctx.shadowColor = enemy.fillStyle;

        ctx.fillRect(-10, -40, 20, 35);
        ctx.beginPath(); ctx.arc(0, -48, 8, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function createParticles(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                size: Math.random() * 5 + 2,
                color: color
            });
        }
    }

    /* OYUN AKIŞI VE ZOR ETKİLEŞİMLER */
    function nextStage() {
        stage++;
        const area = document.getElementById("actionArea");
        const status = document.getElementById("statusText");

        if (stage === 1) {
            status.textContent = "AŞAMA 1: HAVALANDIRMA SÖKME! İŞARETÇİ YEŞİL BÖLGEDEYKEN DOKUN!";
            setupTimingGame();
        } 
        else if (stage === 2) {
            status.textContent = "AŞAMA 2: YAKIN DÖVÜŞ! ÇIKAN HEDEFE 1 SANİYE İÇİNDE TIKLA!";
            setupQTEGame();
        }
        else if (stage === 3) {
            status.textContent = "AŞAMA 3: KOD HACKLEME! YANAN RENK SİSİTEMİNİ AKLINDA TUT VE BASS!";
            setupMemoryGame();
        }
        else if (stage === 4) {
            status.textContent = "GÖREV BAŞARILI! AKSİYON TAMAMLANDI!";
            area.innerHTML = `<button class="main-btn" onclick="location.reload()">TEKRAR OYNA</button>`;
        }
    }

    /* ETKİLEŞİM 1: HASSAS ZAMANLAMA BARI */
    let pointerPos = 0, pointerSpeed = 3, timingInterval;
    function setupTimingGame() {
        const area = document.getElementById("actionArea");
        area.innerHTML = `
            <div class="timing-bar-bg" onclick="checkTiming()">
                <div class="timing-zone"></div>
                <div class="timing-pointer" id="pointer"></div>
            </div>`;
        
        pointerPos = 0;
        timingInterval = setInterval(() => {
            pointerPos += pointerSpeed;
            if (pointerPos > 98 || pointerPos < 0) pointerSpeed *= -1;
            document.getElementById("pointer").style.left = pointerPos + "%";
        }, 15);
    }

    function checkTiming() {
        if (pointerPos >= 40 && pointerPos <= 60) {
            clearInterval(timingInterval);
            vent.open = true;
            player.state = 'climbing';
            player.y = 130;
            createParticles(70, 100, "#00e5ff");
            document.getElementById("statusText").textContent = "MÜKEMMEL! HAVALANDIRMA SÖKÜLDÜ.";
            setTimeout(nextStage, 1500);
        } else {
            document.getElementById("statusText").textContent = "ISKALADIN! DİKKATLİ ZAMANLA!";
            pointerSpeed = pointerSpeed > 0 ? 5 : -5; // Hızlandır
        }
    }

    /* ETKİLEŞİM 2: REFLEKS DÖVÜŞÜ (QTE) */
    function setupQTEGame() {
        player.x = 220;
        player.y = 180;
        player.state = 'idle';
        const area = document.getElementById("actionArea");
        area.innerHTML = "";

        const target = document.createElement("div");
        target.className = "qte-target";
        target.textContent = "VUR!";
        target.style.left = (Math.random() * 50 + 25) + "%";
        target.onclick = () => {
            player.state = 'punching';
            enemy.state = 'hit';
            createParticles(280, 150, "#ef4444");
            document.getElementById("statusText").textContent = "KRİTİK VURUŞ! KORUMA TAVAN YAPTI.";
            setTimeout(() => {
                enemy.alive = false;
                nextStage();
            }, 1200);
        };
        area.appendChild(target);
    }

    /* ETKİLEŞİM 3: HAFIZA / KOD DİZİLİMİ */
    const sequence = [0, 2, 1];
    let userSeq = [];
    function setupMemoryGame() {
        player.state = 'idle';
        const area = document.getElementById("actionArea");
        area.innerHTML = `
            <div class="memory-grid">
                <div class="mem-btn" style="background:#ef4444" onclick="pressMem(0)"></div>
                <div class="mem-btn" style="background:#22c55e" onclick="pressMem(1)"></div>
                <div class="mem-btn" style="background:#00e5ff" onclick="pressMem(2)"></div>
            </div>`;
        playSequence();
    }

    function playSequence() {
        const btns = document.querySelectorAll(".mem-btn");
        sequence.forEach((colorIdx, i) => {
            setTimeout(() => {
                btns[colorIdx].classList.add("active");
                setTimeout(() => btns[colorIdx].classList.remove("active"), 300);
            }, (i + 1) * 600);
        });
    }

    function pressMem(idx) {
        userSeq.push(idx);
        if (userSeq[userSeq.length - 1] !== sequence[userSeq.length - 1]) {
            document.getElementById("statusText").textContent = "HATALI KOD! TEKRAR İZLE!";
            userSeq = [];
            playSequence();
            return;
        }
        if (userSeq.length === sequence.length) {
            document.getElementById("statusText").textContent = "SİSTEM HACKLENDİ!";
            createParticles(canvas.width/2, canvas.height/2, "#22c55e");
            setTimeout(nextStage, 1200);
        }
    }

    // Oyun Döngüsünü Başlat
    drawGame();
</script>

</body>
</html>
